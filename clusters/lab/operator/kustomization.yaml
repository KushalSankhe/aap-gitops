apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Built-in transformer: sets metadata.namespace on every namespaced object
# (OperatorGroup, Subscription).
namespace: giv-aap-sbx

resources:
  - ../../../base/operator

patches:
  # The namespace: line does NOT rename the Namespace object itself.
  - target:
      kind: Namespace
    patch: |-
      - op: replace
        path: /metadata/name
        value: giv-aap-sbx

  # targetNamespaces is a plain string list; the transformer skips it.
  - target:
      kind: OperatorGroup
    patch: |-
      - op: replace
        path: /spec/targetNamespaces/0
        value: giv-aap-sbx

  # Must match the channel of the CSV currently installed in giv-aap-sbx.
  # OLM cannot downgrade. Check: oc get csv -n giv-aap-sbx | grep ansible
  - target:
      kind: Subscription
    patch: |-
      - op: replace
        path: /spec/channel
        value: stable-2.6
